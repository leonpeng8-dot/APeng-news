<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>管理写入 - 阿鹏资讯站</title>
  <meta name="description" content="阿鹏资讯站管理写入页面。粘贴Markdown格式简报内容，选择日期和时段后写入Supabase数据库。支持预览解析、标签管理、批量写入和最近记录管理。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="logo">阿鹏<span class="accent">资讯</span></div>
    <span class="sub">管理写入</span>
    <a href="../" class="back-link">← 返回首页</a>
  </header>

  <div class="container">

    <div class="hint">
      💡 在下方粘贴 Markdown 格式的简报内容，使用 <code>## 标题</code> 分隔每条新闻条目，系统会自动解析。<br>
      写入后可在 <a href="../">阿鹏资讯站</a> 首页查看效果。
    </div>

    <!-- 写入表单 -->
    <div class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label>📅 日期</label>
          <input type="date" id="briefDate" required>
        </div>
        <div class="form-group">
          <label>🕐 时段</label>
          <select id="briefPeriod">
            <option value="早间">早间</option>
            <option value="午间">午间</option>
            <option value="晚间">晚间</option>
            <option value="夜间">夜间</option>
            <option value="专题">专题</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>📝 简报标题</label>
        <input type="text" id="briefTitle" placeholder="例：2026年10月1日 早间简报" required>
      </div>

      <div class="form-group">
        <label>🏷️ 标签（回车添加）</label>
        <div class="tag-input-wrap" id="tagInputWrap">
          <input type="text" id="tagInput" placeholder="输入标签后按回车...">
        </div>
      </div>

      <div class="form-group">
        <label>📄 简报内容（Markdown）</label>
        <textarea id="briefContent" placeholder="在此粘贴 Markdown 内容...

## 第一条新闻标题
新闻正文内容...

## 第二条新闻标题
新闻正文内容..."></textarea>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="previewBtn">👁️ 预览解析</button>
        <button class="btn btn-primary" id="submitBtn">✅ 写入数据库</button>
      </div>
    </div>

    <!-- 预览区 -->
    <div class="preview" id="preview">
      <h3>解析预览（共 <span id="itemCount">0</span> 条）</h3>
      <div id="previewList"></div>
    </div>

    <!-- 最近写入 -->
    <div class="recent-list">
      <h3>📋 最近写入</h3>
      <div id="recentList">
        <div style="color:#9CA3AF;font-size:13px">加载中...</div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
