<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>管理写入 - 阿鹏资讯站</title>
  <meta name="description" content="阿鹏资讯站管理写入页面。粘贴Markdown格式简报内容，选择日期和时段后写入Supabase数据库。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="locked">

  <!-- 密码门禁（密码 apeng2026，验证通过后本会话内免输，刷新需重输） -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-icon">🔒</div>
      <h1>管理写入</h1>
      <p class="gate-sub">这里只有阿鹏能用，请输入访问密码</p>
      <input type="password" id="gateInput" placeholder="输入密码" autocomplete="current-password">
      <button class="btn btn-primary" id="gateBtn">进入</button>
      <p class="gate-error" id="gateError"></p>
    </div>
  </div>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="logo">阿鹏<span class="accent">资讯</span></div>
    <span class="sub">管理写入</span>
    <a href="../" class="back-link">← 返回首页</a>
  </header>

  <div class="container">

    <div class="hint">
      💡 在下方粘贴 Markdown 格式的简报内容，用 <code>## 板块名</code> 分隔板块（如 <code>## 🔥 热榜速览</code>），系统会自动解析成板块与条目。<br>
      写入后可在 <a href="../">阿鹏资讯站</a> 首页按板块查看效果。
    </div>

    <!-- 写入表单 -->
    <div class="form-card">
      <div class="form-row">
        <div class="form-group">
          <label>📅 日期</label>
          <input type="date" id="briefDate" required>
        </div>
        <div class="form-group">
          <label>🕐 时段</label>
          <select id="briefPeriod">
            <option value="早间">早间</option>
            <option value="午间">午间</option>
            <option value="晚间">晚间</option>
            <option value="夜间">夜间</option>
            <option value="专题">专题</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>📝 简报标题</label>
        <input type="text" id="briefTitle" placeholder="例：2026年10月1日 早间简报" required>
      </div>

      <div class="form-group">
        <label>🏷️ 标签（回车添加）</label>
        <div class="tag-input-wrap" id="tagInputWrap">
          <input type="text" id="tagInput" placeholder="输入标签后按回车...">
        </div>
      </div>

      <div class="form-group">
        <label>📄 简报内容（Markdown）</label>
        <textarea id="briefContent" placeholder="在此粘贴 Markdown 内容...

# 阿鹏夜间简报 · 2026-10-01

## 🔥 热榜速览
- 华为与赛力斯达成新五年合作 → 头条2326万热、微博热搜第1

## ⚡ 深度信号
1. 美防长宣布组建自主作战司令部 → 这条被国内热榜完全忽略

## 📈 市场（美股/加密/大宗）
| 品种 | 涨跌 | 判断 |
|------|------|------|
| 道琼斯 | -0.86% | 债务情绪拖累 |"></textarea>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="previewBtn">👁️ 预览解析</button>
        <button class="btn btn-primary" id="submitBtn">✅ 写入数据库</button>
      </div>
    </div>

    <!-- 预览区 -->
    <div class="preview" id="preview">
      <h3>解析预览（共 <span id="itemCount">0</span> 条）</h3>
      <div id="previewList"></div>
    </div>

    <!-- 最近写入 -->
    <div class="recent-list">
      <h3>📋 最近写入</h3>
      <div id="recentList">
        <div style="color:#9CA3AF;font-size:13px">加载中...</div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts -->
  <script src="../js/vendor/supabase.min.js"></script>
  <script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>');</script>
  <script src="../js/admin.js"></script>
  <script>
    /* 密码门禁：密码 apeng2026，只存在 sessionStorage，刷新要重输 */
    (function () {
      var PASSWORD = 'apeng2026';
      var KEY = 'apeng_admin_ok';

      function unlock() {
        document.body.classList.remove('locked');
        var gate = document.getElementById('gate');
        if (gate) gate.remove();
      }

      if (sessionStorage.getItem(KEY) === '1') {
        unlock();
        return;
      }

      document.addEventListener('DOMContentLoaded', function () {
        var input = document.getElementById('gateInput');
        var btn = document.getElementById('gateBtn');
        var err = document.getElementById('gateError');

        function submit() {
          if (input.value === PASSWORD) {
            sessionStorage.setItem(KEY, '1');
            unlock();
          } else {
            err.textContent = '无权限访问：密码不正确';
            input.value = '';
            input.focus();
          }
        }

        btn.addEventListener('click', submit);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
        input.focus();
      });
    })();
  </script>
</body>
</html>
