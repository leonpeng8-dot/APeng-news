<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>管理写入 - 阿鹏资讯站</title>
  <meta name="description" content="阿鹏资讯站管理写入页面。用于粘贴Markdown格式简报内容，选择日期和时段后自动解析条目并写入Supabase数据库。支持预览解析结果、标签管理、批量写入。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-hover: #22222e;
      --border: #2a2a38;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --accent: #7c5cfc;
      --accent-light: #9d7fff;
      --gradient: linear-gradient(135deg, #7c5cfc 0%, #5b8def 100%);
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px; height: 60px;
      background: rgba(10,10,15,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar .logo {
      font-size: 20px; font-weight: 700;
      background: var(--gradient); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
    }
    .topbar .sub { color: var(--text-muted); font-size: 14px; }
    .topbar a { color: var(--accent-light); text-decoration: none; font-size: 14px; margin-left: auto; }

    .container { max-width: 800px; margin: 0 auto; padding: 24px 20px 60px; }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 14px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-row { display: flex; gap: 16px; }
    .form-row .form-group { flex: 1; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 10px 14px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 14px; font-family: var(--font); outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { min-height: 300px; resize: vertical; line-height: 1.6; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; }
    select { cursor: pointer; }
    select option { background: var(--bg-secondary); }

    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      padding: 10px 24px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; cursor: pointer;
      border: none; transition: all .15s;
    }
    .btn-primary {
      background: var(--gradient); color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: var(--bg-secondary); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }

    .preview {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-top: 24px;
      display: none;
    }
    .preview.visible { display: block; }
    .preview h3 { font-size: 15px; margin-bottom: 12px; color: var(--text-secondary); }
    .preview-item {
      padding: 12px; margin-bottom: 8px;
      background: var(--bg-secondary); border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
    }
    .preview-item .pi-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .preview-item .pi-content { font-size: 13px; color: var(--text-secondary); max-height: 100px; overflow: hidden; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 24px;
      color: var(--text-primary); font-size: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3); z-index: 9999;
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(-8px); }

    .recent-list {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; margin-top: 24px;
    }
    .recent-list h3 { font-size: 15px; margin-bottom: 12px; color: var(--text-secondary); }
    .recent-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-item .ri-date { color: var(--text-muted); font-size: 12px; min-width: 100px; }
    .recent-item .ri-period { color: var(--accent-light); font-size: 12px; min-width: 50px; }
    .recent-item .ri-title { flex: 1; }

    .hint {
      padding: 12px 16px; background: var(--bg-secondary);
      border-radius: var(--radius-sm); font-size: 13px;
      color: var(--text-muted); margin-bottom: 20px;
      border-left: 3px solid var(--accent);
    }
    .hint code { color: var(--accent-light); background: var(--bg-card); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 640px) {
      .form-row { flex-direction: column; gap: 0; }
      .container { padding: 16px; }
      textarea { min-height: 200px; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="logo">阿鹏资讯</div>
    <span class="sub">管理写入</span>
    <a href="../">← 返回首页</a>
  </header>

  <div class="container">

    <div class="hint">
      💡 在下方粘贴 Markdown 格式的简报内容。使用 <code>## 标题</code> 分隔每条新闻条目，系统会自动解析。<br>
      写入后可在首页 <a href="../">阿鹏资讯站</a> 查看效果。
    </div>

    <!-- 写入表单 -->
    <div class="form-row">
      <div class="form-group">
        <label>📅 日期</label>
        <input type="date" id="briefDate" required>
      </div>
      <div class="form-group">
        <label>🕐 时段</label>
        <select id="briefPeriod">
          <option value="早间">早间</option>
          <option value="午间">午间</option>
          <option value="晚间">晚间</option>
          <option value="夜间">夜间</option>
          <option value="专题">专题</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>📝 简报标题</label>
      <input type="text" id="briefTitle" placeholder="例：2026年10月1日 早间简报" required>
    </div>

    <div class="form-group">
      <label>🏷️ 标签（逗号分隔）</label>
      <input type="text" id="briefTags" placeholder="例：A股, 美股, 加密">
    </div>

    <div class="form-group">
      <label>📄 简报内容（Markdown）</label>
      <textarea id="briefContent" placeholder="在此粘贴 Markdown 内容...

## 第一条新闻标题
新闻正文内容...

## 第二条新闻标题
新闻正文内容..."></textarea>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="previewItems()">👁️ 预览解析</button>
      <button class="btn btn-primary" onclick="submitBrief()">✅ 写入数据库</button>
    </div>

    <!-- 预览区 -->
    <div class="preview" id="preview">
      <h3>解析预览（共 <span id="itemCount">0</span> 条）</h3>
      <div id="previewList"></div>
    </div>

    <!-- 最近写入 -->
    <div class="recent-list">
      <h3>📋 最近写入</h3>
      <div id="recentList">
        <div style="color:var(--text-muted);font-size:13px">加载中...</div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // === Supabase 配置 ===
    const SUPABASE_URL = 'https://vxlylfiyvorfcgxbympt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cQdNwcX_i9NInAVCzUmWgQ_GJUMptIH';
    let sb = null;

    function initClient() {
      if (sb) return sb;
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return sb;
    }

    // === 初始化 ===
    document.addEventListener('DOMContentLoaded', function() {
      initClient();
      // 设置默认日期为今天
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('briefDate').value = today;
      // 根据当前时间设置默认时段
      const hour = new Date().getHours();
      let defaultPeriod = '早间';
      if (hour >= 11 && hour < 13) defaultPeriod = '午间';
      else if (hour >= 17 && hour < 22) defaultPeriod = '晚间';
      else if (hour >= 22 || hour < 7) defaultPeriod = '夜间';
      document.getElementById('briefPeriod').value = defaultPeriod;
      // 自动填充标题
      const period = document.getElementById('briefPeriod').value;
      document.getElementById('briefTitle').value = today.replace(/-/g, '年').replace(/-/, '月').replace(/-/, '日') + '日 ' + period + '简报';
      // 加载最近写入
      loadRecent();
    });

    // === Markdown 解析条目 ===
    function parseMarkdownItems(content) {
      if (!content || !content.trim()) return [];
      const parts = content.split(/^## /m);
      if (parts.length <= 1) {
        // 尝试 ### 分割
        const h3parts = content.split(/^### /m);
        if (h3parts.length > 1) {
          return h3parts.slice(1).map(function(part) {
            const lines = part.trim().split('\n');
            return { title: lines[0].trim(), content: lines.slice(1).join('\n').trim() };
          });
        }
        return [{ title: '', content: content.trim() }];
      }
      return parts.slice(1).map(function(part) {
        const trimmed = part.trim();
        const lines = trimmed.split('\n');
        return { title: lines[0].trim(), content: lines.slice(1).join('\n').trim() };
      });
    }

    // === 预览解析 ===
    function previewItems() {
      const content = document.getElementById('briefContent').value;
      if (!content.trim()) {
        showToast('请先粘贴简报内容');
        return;
      }
      const items = parseMarkdownItems(content);
      const preview = document.getElementById('preview');
      const list = document.getElementById('previewList');
      document.getElementById('itemCount').textContent = items.length;

      list.innerHTML = items.map(function(item, i) {
        return '<div class="preview-item">' +
          '<div class="pi-title">' + (i+1) + '. ' + escapeHtml(item.title || '(无标题)') + '</div>' +
          '<div class="pi-content">' + escapeHtml(item.content.substring(0, 200)) + (item.content.length > 200 ? '...' : '') + '</div>' +
        '</div>';
      }).join('');
      preview.classList.add('visible');
      showToast('已解析 ' + items.length + ' 条');
    }

    // === 提交写入 ===
    async function submitBrief() {
      const date = document.getElementById('briefDate').value;
      const period = document.getElementById('briefPeriod').value;
      const title = document.getElementById('briefTitle').value.trim();
      const content = document.getElementById('briefContent').value.trim();
      const tagsStr = document.getElementById('briefTags').value.trim();

      if (!date) { showToast('请选择日期'); return; }
      if (!title) { showToast('请输入标题'); return; }
      if (!content) { showToast('请粘贴简报内容'); return; }

      // 解析条目
      const items = parseMarkdownItems(content);
      const tags = tagsStr ? tagsStr.split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];

      const btn = event.target;
      const origText = btn.textContent;
      btn.textContent = '写入中...';
      btn.disabled = true;

      try {
        const { data, error } = await sb.from('briefs').insert([{
          date: date,
          period: period,
          title: title,
          content: content,
          items: items,
          tags: tags,
          is_public: true
        }]).select();

        if (error) throw error;

        showToast('✅ 写入成功！共 ' + items.length + ' 条');
        // 清空内容
        document.getElementById('briefContent').value = '';
        document.getElementById('preview').classList.remove('visible');
        // 重新加载最近列表
        loadRecent();
      } catch (err) {
        console.error('写入失败:', err);
        showToast('❌ 写入失败: ' + (err.message || err));
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
      }
    }

    // === 加载最近写入 ===
    async function loadRecent() {
      try {
        const { data, error } = await sb.from('briefs')
          .select('id,date,period,title')
          .order('created_at', { ascending: false })
          .limit(10);
        if (error) throw error;

        const list = document.getElementById('recentList');
        if (!data || data.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted);font-size:13px">暂无简报，写入第一条试试</div>';
          return;
        }
        list.innerHTML = data.map(function(b) {
          return '<div class="recent-item">' +
            '<span class="ri-date">' + b.date + '</span>' +
            '<span class="ri-period">' + b.period + '</span>' +
            '<span class="ri-title">' + escapeHtml(b.title) + '</span>' +
          '</div>';
        }).join('');
      } catch (err) {
        document.getElementById('recentList').innerHTML =
          '<div style="color:var(--fire);font-size:13px">加载失败: ' + escapeHtml(err.message || '') + '</div>';
      }
    }

    // === 工具函数 ===
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(function() { toast.classList.remove('visible'); }, 3000);
    }

    // 标题自动更新
    document.getElementById('briefPeriod').addEventListener('change', function() {
      const date = document.getElementById('briefDate').value;
      if (date) {
        const d = date.split('-');
        document.getElementById('briefTitle').value = d[0] + '年' + d[1] + '月' + d[2] + '日 ' + this.value + '简报';
      }
    });
  </script>
</body>
</html>
